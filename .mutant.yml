# Mutation testing configuration. Every subject in lib/ is mutated and every mutation must be
# killed by the spec suite (see CONTRIBUTING.md).
usage: opensource
integration:
  name: rspec
requires:
  - http_loader
includes:
  - lib
matcher:
  subjects:
    - HttpLoader*
mutation:
  timeout: 20.0
  # Mutations that cannot change observable behavior. Each pattern is matched against the node
  # being mutated. Every entry states why it is equivalent.
  ignore_patterns:
    # `sig { ... }` blocks are checked statically by `srb tc` (and at runtime by sorbet-runtime);
    # mutating the signature DSL only produces type errors the method's own examples already surface.
    - block{receiver=send{selector=sig}}
    # `T.must` and `T.cast` are static type assertions that `lib/`'s `typed: strong` sigil forces
    # (Sorbet proves the value is non-nil / of the asserted type). Removing the assertion is
    # behaviourally equivalent on every path the type checker accepts, so no runtime test can kill
    # the mutation -- it is guarded by `srb tc`, exactly like a `sig`. Mutations of the asserted
    # *value or type argument* are distinct nodes and are still tested.
    - send{selector=must}
    - send{selector=cast}
    # `T.type_alias { ... }` blocks define a static type, checked by `srb tc`, never executed as
    # behaviour. Mutating the type expression inside only changes a compile-time annotation (and
    # sorbet-runtime checks generics shallowly), so no runtime test can observe it -- same basis as
    # a `sig` block.
    - block{receiver=send{selector=type_alias}}
    # Numeric coercion of a local variable: `ResourceMonitor#query_getconf`'s `out.to_i` (getconf
    # output) and `#read_rss_kb`'s `rss_field.to_i` (a `/proc/<pid>/statm` field). The kernel and
    # getconf only ever emit well-formed non-negative integer strings, so on their guaranteed input
    # domain `.to_i`, `Integer(...)` and `.to_f` are interchangeable -- the only strings that would
    # distinguish them (hex, embedded non-digits, fractions) never occur. The receiver is a bare
    # local (the field/value is extracted to one first), so this prunes nothing but the coercion.
    # No `lvar.to_f` is ignored, so `Pacing`'s meaningful `start_time.to_f` stays fully mutated.
    - send{selector=to_i receiver=lvar}
    # Same numeric-coercion equivalence for `#read_cpu_perc`'s `T.must(tail[11]).to_f` /
    # `T.must(tail[12]).to_f` (integer jiffy counts from `/proc/<pid>/stat`) and `#fallback_ps_stats`'s
    # `T.must(rss_kb_str).to_f` (an integer KB field from `ps`). The `T.must(...)` receiver subtree is
    # already pruned by the `must` ignore above, so this adds no coverage loss beyond the coercion.
    - send{selector=to_f receiver=send{selector=must}}
coverage_criteria:
  process_abort: true
