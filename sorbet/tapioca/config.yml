gem:
  # Tapioca is the generator itself; spoom is its runtime helper. Neither ships a gem any
  # checked file loads, and generating their own RBIs is meaningless.
  exclude:
  - tapioca
  - spoom
  # Reek and the dry-rb gems it depends on are development tools that no checked file refers to.
  # Compiling their RBIs touches constants that dry-rb has deprecated, which prints deprecation
  # notices that the warning gate rejects.
  - reek
  - dry-configurable
  - dry-core
  - dry-inflector
  - dry-initializer
  - dry-logic
  - dry-schema
  - dry-types
