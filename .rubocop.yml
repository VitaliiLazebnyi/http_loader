# Maximum strictness: every cop of RuboCop and of every plugin is enabled (EnabledByDefault), including
# the ones RuboCop ships disabled, and every offense fails the build. There is no todo file, no inline
# directive (Style/DisableCopsWithinSourceCodeDirective, script/forbidden_suppressions.sh) and no file
# exclusion. The only cops switched off are the ones that contradict another enabled cop or the Sorbet
# signature style this gem is written in; each one names the cop it conflicts with.
plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sorbet
  - rubocop-thread_safety

require:
  - rubocop-ai

AllCops:
  EnabledByDefault: true
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    # Generated or vendored trees that are not hand-authored source.
    - 'vendor/**/*'
    - 'coverage/**/*'
    - 'sorbet/rbi/gems/**/*'
    - 'tmp/**/*'
    - 'doc/**/*'
    - '.yardoc/**/*'
    - '.mutant/**/*'

# --- Settings (not exemptions) ---------------------------------------------------------------------------

# The same width as Markdown (markdownlint MD013), YAML (yamllint) and every other file (.editorconfig).
Layout/LineLength:
  Max: 120

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# Markdown code blocks are fragments of a program, not files, so they carry no copyright header.
Style/Copyright:
  Notice: '^# Copyright \(c\) 2026 Vitalii Lazebnyi$'
  AutocorrectNotice: '# Copyright (c) 2026 Vitalii Lazebnyi'
  Exclude:
    - '**/*.md'

# Rescued exceptions are named `error`, as in leechtop-downloader, rather than the default `e`.
Naming/RescuedExceptionsVariableName:
  PreferredName: error

# Sorbet signatures name every parameter, including the block, so anonymous block forwarding (`&`) cannot
# be used in typed code.
Naming/BlockForwarding:
  EnforcedStyle: explicit

# Sorbet type-checks the specs (sorbet/config: --enable-experimental-rspec). Explicit predicate calls and
# explicit class names are statically resolved; dynamic predicate matchers (`be_empty`) go through
# method_missing and `described_class::CONST` is a dynamic constant reference, which Sorbet cannot check.
RSpec/PredicateMatcher:
  EnforcedStyle: explicit
RSpec/DescribedClass:
  EnforcedStyle: explicit

# Layout/MultilineArrayLineBreaks, MultilineHashKeyLineBreaks and MultilineMethodArgumentLineBreaks (all
# enabled) put every element of a multi-line literal or call on its own line. The length cops therefore count
# such a literal or call as one line (as standalone_migrations does for examples); their default maximums stay.
Metrics/BlockLength:
  CountAsOne: &count_as_one
    - array
    - hash
    - heredoc
    - method_call
Metrics/ClassLength:
  CountAsOne: *count_as_one
Metrics/MethodLength:
  CountAsOne: *count_as_one
Metrics/ModuleLength:
  CountAsOne: *count_as_one
RSpec/ExampleLength:
  CountAsOne: *count_as_one

# Style/MissingElse requires an `else` on every `if` and `case`; with Style/EmptyElse at its default style
# ("both") the two cops contradict each other on `else nil`. The "empty" style still rejects an empty `else`.
Style/EmptyElse:
  EnforcedStyle: empty

# --- Disabled: contradict another enabled cop ------------------------------------------------------------

# Requires a leading `::` on every constant. Style/RedundantConstantBase (enabled) forbids exactly that
# prefix, and RuboCop documents the two as mutually exclusive.
Lint/ConstantResolution:
  Enabled: false

# Style/ArgumentsForwarding rewrites named block parameters to anonymous `&` forwarding, which
# Naming/BlockForwarding (explicit, above) and Sorbet signatures (every parameter is named) forbid.
Style/ArgumentsForwarding:
  Enabled: false

# The sigil cops form a ladder. lib/ is `typed: strong` (no T.untyped value anywhere); scripts and RBIs
# are `strict`; specs are `true` (TrueSigil applies to every file) because RSpec's `let` and example
# blocks have no signatures to declare.
Sorbet/StrongSigil:
  Include:
    - 'lib/**/*.rb'
Sorbet/StrictSigil:
  Include:
    - 'lib/**/*.rb'
    - 'script/**/*.rb'
    - 'sorbet/**/*.rb'
    - 'sorbet/**/*.rbi'

# Prefers Symbol hash keys. HTTP header maps are String-keyed by protocol: Net::HTTP request headers and
# Rack 3 response headers (the Rack SPEC requires String names). Its autocorrect turns them into Symbols,
# which silently changes the headers the server sends and the client parses.
Style/StringHashKeys:
  Enabled: false

# Contradicts Sorbet either way. The "fetch" style reports Sorbet's generic type syntax (`T::Array[String]`,
# `T::Hash[K, V]`) as hash lookups and autocorrects it to `T::Array.fetch(String)`, which is not a type. The
# "brackets" style rewrites `fetch` (non-nilable to Sorbet, raises on a missing key) into `[]` (nilable).
Style/HashLookupMethod:
  Enabled: false

# Requires a comment directly above each public `def`. Sorbet and yard-sorbet put the YARD comment above
# the `sig`, which separates it from the `def`, so the cop reports every documented method. `rake yard`
# fails unless every public API object is documented, which enforces the same rule.
Style/DocumentationMethod:
  Enabled: false

# --- Disabled: forbid the Sorbet signature syntax itself -------------------------------------------------
# These cops exist for codebases that write their types as RBS comments (`#: (Integer) -> void`, `#: as
# Integer`, `#: as !nil`). They forbid `sig`, `extend T::Sig`, `T.let`, `T.cast`, `T.must`, `T.type_alias`,
# `T::Struct` and `T::Helpers`, the runtime-checked forms this gem uses: Sorbet/EnforceSignatures (enabled,
# `sig` style) requires a `sig` on every method, and `typed: strong` requires `T.let` on every instance
# variable and a checked `T.cast` wherever an untyped library value (OptionParser, Async) enters typed code.
Sorbet/ForbidSig:
  Enabled: false
Sorbet/ForbidTSig:
  Enabled: false
Sorbet/ForbidSigWithRuntime:
  Enabled: false
Sorbet/ForbidTLet:
  Enabled: false
Sorbet/ForbidTCast:
  Enabled: false
Sorbet/ForbidTMust:
  Enabled: false
Sorbet/ForbidTTypeAlias:
  Enabled: false
Sorbet/ForbidTypeAliasedShapes:
  Enabled: false
Sorbet/ForbidTStruct:
  Enabled: false
Sorbet/ForbidTHelpers:
  Enabled: false
Sorbet/RedundantExtendTSig:
  Enabled: false
