plugins:
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-rake
  - rubocop-rspec
  - rubocop-md

require:
  - rubocop-ai

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - '.gemini/**/*'
    - 'vendor/**/*'
    - 'CODE_REVIEW.md'

Metrics/ClassLength:
  Max: 140

# The integration suite boots throwaway local servers on background threads to keep
# end-to-end coverage off the network; the thread-safety and method-size cops do not
# apply to that scaffolding.
ThreadSafety/NewThread:
  Exclude:
    - 'spec/integration/**/*'
Metrics/MethodLength:
  Exclude:
    - 'spec/integration/**/*'
Metrics/AbcSize:
  Exclude:
    - 'spec/integration/**/*'

Style/FrozenStringLiteralComment:
  Enabled: true

Gemspec/DevelopmentDependencies:
  Enabled: false

Layout/LineLength:
  Max: 200

RSpec/ExampleLength:
  Max: 25

RSpec/MultipleExpectations:
  Max: 10

RSpec/NestedGroups:
  Max: 5

RSpec/MultipleMemoizedHelpers:
  Max: 7

Naming/BlockForwarding:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

AI/AdverbSpam:
  Enabled: true