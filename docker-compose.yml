# Docker-based test harness for http_loader.
#
#   docker compose run --build --rm ci          # full gate: specs+coverage, rubocop, sorbet, yard, reek, flay, audit
#   docker compose run --build --rm test        # rspec only (unit + integration)
#   docker compose run --build --rm integration # live client/server/harness over the Linux /proc paths
#   docker compose run --build --rm lint        # rubocop
#   docker compose run --build --rm types       # tapioca gem RBIs + srb tc
#   docker compose run --build --rm mutant      # mutation testing
#
# NOTE: pass --build so edits are picked up; `docker compose run` reuses a cached image otherwise.
services:
  ci:
    build: .
    command: bundle exec rake

  test:
    build: .
    command: bundle exec rspec

  integration:
    build: .
    command: bundle exec rspec spec/integration

  lint:
    build: .
    command: bundle exec rake rubocop suppressions

  types:
    build: .
    command: bundle exec rake typecheck

  mutant:
    build: .
    command: bundle exec mutant run
