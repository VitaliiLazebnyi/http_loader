---
# Keys are sorted alphabetically in every mapping (yamllint key-ordering), so `name` and `on` follow `jobs`.
# The Dockerfile itself is linted by hadolint in the Lint workflow (script/lint.sh).
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  scan:
    name: Build and scan image (Trivy)
    permissions:
      contents: read  # checks out the repository
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            auth.docker.io:443
            deb.debian.org:80
            ghcr.io:443
            github.com:443
            index.rubygems.org:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
            storage.googleapis.com:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag http_loader:ci .
      # The archive (trivy_0.76.2_Linux-64bit.tar.gz) is verified against its published SHA-256 before it is run.
      - env:
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          TRIVY_VERSION: 0.76.2
        name: Install Trivy 0.76.2
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" trivy
      # Fails on any vulnerability of any severity that has a fix. A vulnerability without an upstream fix yet
      # cannot be remediated here; the weekly schedule and Dependabot's base-image updates pick up fixes.
      - env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_NO_PROGRESS: 'true'
        name: Scan for fixable vulnerabilities of any severity
        run: >-
          "${RUNNER_TEMP}/trivy" image --scanners vuln --ignore-unfixed --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --exit-code 1 http_loader:ci
    timeout-minutes: 20

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Docker)
    needs:
      - scan
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read  # checks out the gate script
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Docker)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: Docker

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 31 7 * * 1  # weekly: newly disclosed vulnerabilities of the base image
  workflow_dispatch: {}

# Nothing is writable by default; every job re-declares the permissions it needs.
permissions: {}
...
