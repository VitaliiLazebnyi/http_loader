---
# Keys are sorted alphabetically in every mapping (yamllint key-ordering), so `name` and `on` follow `jobs`.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The Scorecard webapp only accepts results from a job whose steps all `use` an approved action, so the SARIF
  # file is fixed up and uploaded by the next job.
  analysis:
    name: Scorecard analysis
    permissions:
      contents: read  # checks out the repository
      id-token: write  # publishes the results to the OpenSSF Scorecard API (OIDC)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            pkg-containers.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          publish_results: true
          results_file: results.sarif
          results_format: sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          if-no-files-found: error
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
    timeout-minutes: 15

  upload:
    name: Upload the Scorecard results
    needs:
      - analysis
    permissions:
      actions: read  # downloads the SARIF artifact of the analysis job
      security-events: write  # uploads the SARIF results to code scanning
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            uploads.github.com:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      # Downloaded with the GitHub CLI: actions/download-artifact 8.0.2 (the newest release) emits Node's DEP0005
      # Buffer() deprecation warning on every download (actions/download-artifact#484), which the warning gate
      # rejects.
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        name: Download the Scorecard results
        run: gh run download "${RUN_ID}" --name scorecard-sarif --repo "${GITHUB_REPOSITORY}"
      # Scorecard reports findings about the whole repository (Branch-Protection, Code-Review, Fuzzing, ...)
      # under the placeholder URI "no file associated with this alert", which upload-sarif rejects with a
      # warning. Point them at this workflow, the file that produces them.
      - name: Give repository-level findings a valid location
        run: |
          jq '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation
            | select(.uri == "no file associated with this alert")).uri = ".github/workflows/scorecard.yml"' \
            results.sarif > results.located.sarif
          mv results.located.sarif results.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
    timeout-minutes: 10

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Scorecard)
    needs:
      - analysis
      - upload
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read  # checks out the gate script
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Scorecard)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: OpenSSF Scorecard

'on':
  branch_protection_rule: {}
  push:
    branches:
      - main
  schedule:
    - cron: 23 6 * * 1
  workflow_dispatch: {}

# Nothing is writable by default; every job re-declares the permissions it needs.
permissions: {}
...
