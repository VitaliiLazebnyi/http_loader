name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBYOPT: -W:deprecated

jobs:
  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - name: Check the Ruby version
      run: script/check_ruby.sh
    - run: bundle exec rake audit

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # post the dependency review summary on the pull request
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Requires the repository's Dependency graph to be enabled (Settings > Code security). Until
    # an owner enables it the action errors out; that must not block the PR, so the step is
    # allowed to fail. Ruby dependency CVEs are covered unconditionally by the bundler-audit job.
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      continue-on-error: true
      with:
        fail-on-severity: low
        comment-summary-in-pr: on-failure

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # The pinned release binary is run directly: the gitleaks action still runs on a deprecated
    # Node.js version and logs deprecation warnings. The archive is verified against its published
    # SHA-256 first.
    - name: Install gitleaks 8.30.1
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
        echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

    - name: Scan the full history for secrets
      run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [bundler-audit, dependency-review, gitleaks]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fail on any warning or deprecation in the logs of this run
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_JOB_NAME: Warning gate
      run: script/warning_gate.sh
