---
# Keys are sorted alphabetically in every mapping (yamllint key-ordering), so `name` and `on` follow `jobs`.
# Every step that runs Ruby code sets RUBYOPT: all warnings (`-w`, plus the deprecation and performance
# categories), with script/upstream_warnings.rb dropping the few listed warnings that the newest releases of the
# development tools emit about their own code. It is not set while setup-ruby installs the gems, where only
# RubyGems' own installer runs.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  bundler-audit:
    name: bundler-audit
    permissions:
      contents: read  # checks out the repository
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version
          rubygems: latest
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - env:
          RUBYOPT: -w -W:deprecated -W:performance -r${{ github.workspace }}/script/upstream_warnings.rb
        run: bundle exec rake audit
    timeout-minutes: 15

  # Requires the repository's Dependency graph to be enabled (Settings > Code security).
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    permissions:
      contents: read  # checks out the repository
      pull-requests: write  # posts the dependency review summary on the pull request
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            index.rubygems.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rubygems.org:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Vulnerabilities, licenses and denied packages; the configuration file explains the Scorecard settings.
      - id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          config-file: ./.github/dependency-review.yml
      # The OpenSSF Scorecard of every added dependency, with the per-package allowances of the configuration file.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: .ruby-version
          rubygems: latest
      - name: Check the Ruby version
        run: script/check_ruby.sh
      - env:
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
          RUBYOPT: -w -W:deprecated -W:performance -r${{ github.workspace }}/script/upstream_warnings.rb
        name: OpenSSF Scorecard of the added dependencies
        run: script/scorecard_check
    timeout-minutes: 15

  # The full history, with the default rules of gitleaks (.gitleaks.toml).
  gitleaks:
    name: Secret scanning (gitleaks)
    permissions:
      contents: read  # checks out the repository
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned linters and scanners
        run: script/install_tools.sh
      - name: Run the checks
        run: >-
          script/lint.sh gitleaks
    timeout-minutes: 15

  # Every known vulnerability of any severity in every lockfile (OSV-Scanner), npm's advisories at the lowest
  # threshold, and the registry signatures of the npm packages (script/lint.sh osv npmaudit).
  vulnerabilities:
    name: Dependency vulnerabilities (OSV-Scanner, npm audit)
    permissions:
      contents: read  # checks out the repository
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            api.github.com:443
            api.osv.dev:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned linters and scanners
        run: script/install_tools.sh
      - name: Run the checks
        run: script/lint.sh osv npmaudit
    timeout-minutes: 15

  warning-gate:
    if: ${{ !cancelled() }}
    name: Warning gate (Security)
    needs:
      - bundler-audit
      - dependency-review
      - gitleaks
      - vulnerabilities
    permissions:
      actions: read  # reads the logs of the other jobs of this run
      contents: read  # checks out the gate script
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (egress limited to the endpoints below)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          allowed-endpoints: >-
            *.blob.core.windows.net:443
            api.github.com:443
          disable-sudo: true
          disable-telemetry: true
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:
          GATE_JOB_NAME: Warning gate (Security)
          GH_TOKEN: ${{ github.token }}
        name: Fail on any warning or deprecation in the logs of this run
        run: script/warning_gate.sh
    timeout-minutes: 10

name: Security

'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 17 4 * * 1
  workflow_dispatch: {}

# Nothing is writable by default; every job re-declares the permissions it needs.
permissions: {}
...
