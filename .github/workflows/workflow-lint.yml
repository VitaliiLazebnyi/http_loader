name: Workflow lint

on:
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - '.githooks/**'
      - 'script/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/**'
      - '.githooks/**'
      - 'script/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The archive is verified against its published SHA-256 before it is run.
    - name: Install actionlint 1.7.12
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # actionlint_1.7.12_linux_amd64.tar.gz
      run: |
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
        echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
    - run: '"$RUNNER_TEMP/actionlint" -color'
    - name: ShellCheck the scripts and the pre-commit hook
      run: shellcheck script/*.sh .githooks/pre-commit

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      with:
        advanced-security: false
        persona: pedantic

  warning-gate:
    name: Warning gate
    if: ${{ !cancelled() }}
    needs: [actionlint, zizmor]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # reads the logs of the other jobs of this run
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fail on any warning or deprecation in the logs of this run
      env:
        GH_TOKEN: ${{ github.token }}
        GATE_JOB_NAME: Warning gate
      run: script/warning_gate.sh
